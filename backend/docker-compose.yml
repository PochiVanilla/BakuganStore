# MySQL 8.4 để LẬP TRÌNH trên máy cá nhân (Windows / macOS / Linux, cần Docker Desktop).
# Không dùng file này trên mini PC — mini PC dùng deploy/docker-compose.yml.
#
#   cd backend
#   docker compose up -d      # bật MySQL (lần đầu mất ~30 giây)
#   docker compose down       # tắt (dữ liệu vẫn giữ)
#   docker compose down -v    # tắt và XOÁ sạch dữ liệu lập trình
#
# Mật khẩu, cổng, tên CSDL đọc từ backend/.env (tạo từ .env.example).
name: tdbakugan-dev

services:
  mysql:
    image: mysql:8.4
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Thiếu DB_ROOT_PASSWORD trong backend/.env}
      MYSQL_DATABASE: ${DB_NAME:-tdbakugan}
      MYSQL_USER: ${DB_USER:-tdbakugan}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong backend/.env}
    # Chỉ mở trên chính máy này (127.0.0.1), máy khác trong mạng không vào được.
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-dev:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql-dev:
